plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '{{resolved.moddevgradle}}'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

java.toolchain.languageVersion = JavaLanguageVersion.of({{resolved.java}})

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Launches GameTestServer and runs all registered gametests, then exits.
        // The server crashes when no gametests are provided.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Applies to all the run configs above.
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // Binds the sources to the mod. Multi-mod projects define one per mod.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// A dependency configuration for mods that should be present when running but not published as a
// dependency of this one. Use it instead of 'runtimeOnly'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Fills the version tokens in neoforge.mods.toml from gradle.properties. Only plain version text goes
// through here: Gradle's `expand` would break on a "$" in the description, so the free text was
// written into the file when the project was generated.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replacements = [
            mod_version            : mod_version,
            neo_version            : neo_version,
            minecraft_version_range: minecraft_version_range,
    ]
    inputs.properties replacements
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
    filter { text -> replacements.inject(text) { result, entry -> result.replace("@${entry.key}@", entry.value) } }
}
// Include the output of "generateModMetadata" as an input directory for the build.
// This works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// Run it on every project reload so it never has to be run by hand.
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
