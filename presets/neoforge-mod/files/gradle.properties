# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment properties. EMD filled these in from the live version data.
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version={{resolved.minecraft}}
minecraft_version_range=[{{resolved.minecraft}}]
neo_version={{resolved.neoforge}}

# Mod properties
# The mod id must be lowercase and fit [a-z][a-z0-9_]{1,63}. It must match the MODID constant in the main class.
mod_id={{input.modId}}
mod_version={{input.version}}
# The group id is only important when publishing as an artifact to a Maven repository.
mod_group_id={{input.package}}
